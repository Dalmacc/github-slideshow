name: GodBridge Minecraft client graphics smoke
on:
  push:
    branches: [godbridge-ci-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install Mesa software graphics diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 vulkan-tools x11-utils imagemagick xdotool wmctrl
      - name: Extract isolated project
        run: |
          mkdir -p godbridge
          tar -xJf godbridge-source.tar.xz -C godbridge
          java -version
      - name: Probe GPU + attempt Minecraft via software EGL
        working-directory: godbridge
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEODRIVER: x11
          SDL_VIDEO_X11_FORCE_EGL: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -uo pipefail
          cat > run-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          echo "DISPLAY=$DISPLAY" | tee graphics-info.log
          xdpyinfo -ext GLX >> graphics-info.log 2>&1 || true
          glxinfo -B >> graphics-info.log 2>&1 || true
          vulkaninfo --summary >> graphics-info.log 2>&1 || true
          echo "---graphics-preflight---"
          tail -n 60 graphics-info.log
          timeout --signal=TERM --kill-after=8s 175s gradle --no-daemon --console=plain runClient > client-smoke.log 2>&1 &
          runner_pid=$!
          capture_game_window() {
            local label="$1"
            local xvfb_cmd game_display game_auth win_id
            xvfb_cmd="$(ps -eo args | grep -E '^Xvfb :[0-9]+' | tail -n 1 || true)"
            game_display="$(echo "$xvfb_cmd" | awk '{print $2}')"
            game_auth="$(echo "$xvfb_cmd" | sed -nE 's/.* -auth ([^ ]+).*/\1/p')"
            {
              echo "---window capture $label---"
              echo "Xvfb selected: $xvfb_cmd"
              echo "DISPLAY=$game_display XAUTHORITY=$game_auth"
            } >> windows.log
            if [[ -z "$game_display" || -z "$game_auth" ]]; then return; fi
            DISPLAY="$game_display" XAUTHORITY="$game_auth" xwininfo -root -tree >> windows.log 2>&1 || true
            win_id="$(DISPLAY="$game_display" XAUTHORITY="$game_auth" xwininfo -root -tree 2>/dev/null | awk '/"Minecraft/ {print $1; exit}' || true)"
            echo "MINECRAFT_WINDOW_ID_${label}=$win_id" >> windows.log
            if [[ -n "$win_id" ]]; then
              DISPLAY="$game_display" XAUTHORITY="$game_auth" import -window "$win_id" "client-screen-${label}.png" 2>>graphics-info.log || true
            fi
          }
          sleep 100
          capture_game_window first
          # Fresh CI profiles open the accessibility welcome page. Click its
          # centered Continue button using exact window-local coordinates.
          inner_xvfb="$(ps -eo args | grep -E '^Xvfb :[0-9]+' | tail -n 1 || true)"
          inner_display="$(echo "$inner_xvfb" | awk '{print $2}')"
          inner_auth="$(echo "$inner_xvfb" | sed -nE 's/.* -auth ([^ ]+).*/\1/p')"
          inner_window="$(DISPLAY="$inner_display" XAUTHORITY="$inner_auth" xwininfo -root -tree 2>/dev/null | awk '/"Minecraft/ {print $1; exit}' || true)"
          if [[ -n "$inner_window" ]]; then
            echo "CLICK_ACCESSIBILITY_CONTINUE_WINDOW=$inner_window" >> windows.log
            DISPLAY="$inner_display" XAUTHORITY="$inner_auth" xdotool windowfocus "$inner_window" || true
            DISPLAY="$inner_display" XAUTHORITY="$inner_auth" xdotool mousemove --window "$inner_window" 427 448 click 1 || true
            sleep 12
            capture_game_window menu
          fi
          echo "--- JVM processes after 105s ---" > process-info.log
          jcmd -l >> process-info.log 2>&1 || true
          ps -eo pid,ppid,pcpu,pmem,etime,comm,args --sort=-pcpu | head -n 35 >> process-info.log || true
          java_pid="$(jcmd -l 2>/dev/null | awk '/net.fabricmc.devlaunchinjector.Main/ {print $1; exit}')"
          echo "MINECRAFT_JAVA_PID=$java_pid" >> process-info.log
          if [[ -n "$java_pid" ]]; then
            jcmd "$java_pid" Thread.print -l > thread-dump.txt 2>&1 || true
          fi
          sleep 35
          capture_game_window late
          wait "$runner_pid"
          code=$?
          echo "CLIENT_EXIT_CODE=$code" | tee -a client-smoke.log
          echo "--- Minecraft markers ---"
          grep -Ei 'godbridge|Minecraft 26.3|mods:|backend|Exception|ERROR|OpenGL|Vulkan|GLX|render' client-smoke.log | tail -n 120 || true
          if grep -qE '(MixinApplyError|InvalidMixinException|NoSuchMethodError|ExceptionInInitializerError)' client-smoke.log; then
            echo "FATAL_MOD_OR_API_ERROR=1" | tee -a windows.log
            exit 1
          fi
          if ! grep -q 'Reloading ResourceManager' client-smoke.log; then
            echo "BOOTSTRAP_INCOMPLETE=1" | tee -a windows.log
            exit 1
          fi
          if ! grep -q 'MINECRAFT_WINDOW_ID_late=[0-9]' windows.log; then
            echo "NO_CAPTURED_MINECRAFT_WINDOW=1" | tee -a windows.log
            exit 1
          fi
          SCRIPT
          chmod +x run-smoke.sh
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./run-smoke.sh
      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godbridge-client-graphics-smoke
          path: |
            godbridge/graphics-info.log
            godbridge/client-smoke.log
            godbridge/client-screen-first.png
            godbridge/client-screen-late.png
            godbridge/client-screen-menu.png
            godbridge/windows.log
            godbridge/process-info.log
            godbridge/thread-dump.txt
            godbridge/run/logs/latest.log
            godbridge/run/crash-reports/*.txt
          if-no-files-found: warn
