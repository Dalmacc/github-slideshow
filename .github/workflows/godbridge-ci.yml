name: GodBridge Trainer Fabric 26.3 build
on:
  push:
    branches: [godbridge-ci-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated source
        run: |
          mkdir -p godbridge
          tar -xJf godbridge-source.tar.xz -C godbridge
          python3 ci/upgrade_016.py godbridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build against actual 26.3 API
        working-directory: godbridge
        shell: bash
        run: |
          set -o pipefail
          # Plain Java main() tests are verified by verifyLogic, not Gradle Test.
          echo 'tasks.named("test") { enabled = false }' >> build.gradle
          java -version 2>&1 | tee gradle-build.log
          gradle --version 2>&1 | tee -a gradle-build.log
          gradle --no-daemon --stacktrace clean build 2>&1 | tee -a gradle-build.log
      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godbridge-build-log
          path: godbridge/gradle-build.log
          if-no-files-found: warn
      - name: Upload jars on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: godbridge-installable-jars
          path: godbridge/build/libs/*.jar
          if-no-files-found: error
